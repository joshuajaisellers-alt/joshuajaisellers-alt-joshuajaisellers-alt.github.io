<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-labelledby="title desc">
  <title id="title">JSCo JaiSellers Companies logo</title>
  <desc id="desc">Gold JSCo monogram and JaiSellers Companies wordmark on a dark background.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.26" stop-color="#d7a83f"/>
      <stop offset="0.52" stop-color="#f8df7a"/>
      <stop offset="0.78" stop-color="#a87419"/>
      <stop offset="1" stop-color="#ffe891"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#f8df7a" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="520" height="260" rx="30" fill="#10100f"/>
  <g filter="url(#glow)">
    <text x="260" y="127" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="700" letter-spacing="-10" fill="#151515" stroke="url(#gold)" stroke-width="5">JSCo</text>
    <text x="260" y="207" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="30" letter-spacing="6" fill="#151515" stroke="url(#gold)" stroke-width="1.7">JAISELLERS COMPANIES</text>
  </g>
</svg>
